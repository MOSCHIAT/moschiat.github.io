<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOSCHIAT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

section{
    width:min(900px,90%);
}

.logo{

    font-size:.8rem;
    letter-spacing:.45em;
    color:#888;
    margin-bottom:40px;
    text-transform:uppercase;

}

h1{

    font-weight:300;
    font-size:clamp(2.3rem,6vw,5rem);
    line-height:1.08;

}

strong{
    font-weight:600;
}

.line{

    width:80px;
    height:1px;
    background:#444;
    margin:50px 0;

}

p{

    max-width:620px;
    color:#9c9c9c;
    font-size:1rem;
    line-height:1.9;

}

footer{

    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:#555;
    font-size:.75rem;
    letter-spacing:.18em;

}

::selection{
    background:#fff;
    color:#000;
}

</style>

</head>

<body>

<section>

<div class="logo">
MOSCHIAT
</div>

<h1>
Toda marca começa com uma <strong>promessa</strong>.<br>
Cresce através da <strong>experiência</strong>.<br>
Permanece pela <strong>conexão</strong>.
</h1>

<div class="line"></div>

<p>

</p>

</section>

<footer>
EST. 2026
</footer>

</body>
</html>
